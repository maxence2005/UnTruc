      rr(it.x + 10, it.y + it.h - 30, it.w - 20, 22, 8); ctx.fillStyle = FAMILY[item.fam].color; ctx.fill();
      text(FAMILY[item.fam].label, it.cx, it.y + it.h - 19, 13, INK, 'center', 'bold'); }
    else if (it.kind === 'chip') { const on = state.fighter[it.k] === it.i;
      if (it.i === 0) text(COS[it.k].label, 48, it.y + it.h / 2, 19, INK, 'left', 'bold');
      rr(it.x, it.y, it.w, it.h, 12); fillO(on ? '#fff3c4' : PANEL2, on ? 4 : 2); if (focus) focusRing(it);
      if (isColor(it.k)) { rr(it.x + 14, it.y + 14, it.w - 28, it.h - 28, 8); fillO(COS[it.k].opts[it.i], 2); }
      else { const f = { ...state.fighter, [it.k]: it.i, weapon: 'mains', wolfPreview: false };
        ctx.save(); ctx.beginPath(); ctx.roundRect(it.x + 2, it.y + 2, it.w - 4, it.h - 4, 10); ctx.clip();
        drawFighter(it.x + it.w / 2, it.y + (it.k === 'outfit' ? 64 : 120), it.k === 'outfit' ? 0.3 : 0.5, f); ctx.restore(); }
      if (on) { rr(it.x, it.y, it.w, it.h, 12); ctx.lineWidth = 4; ctx.strokeStyle = '#d99a00'; ctx.stroke(); } }
    else if (it.kind === 'slot') { const id = it.slot === 'weapon' ? state.fighter.weapon : state.fighter.skills[it.slot];
      rr(it.x, it.y, it.w, it.h, 12); fillO(id ? PANEL2 : '#ece5d6', 2.5); if (focus) focusRing(it);
      const r = Math.min(it.w, it.h) * 0.36;
      if (id) { drawIcon(id, it.x + it.w / 2, it.y + 46, r); wrap(ITEMS[id].name, it.w - 6, 13, 'bold').slice(0, 2).forEach((l, j) => text(l, it.x + it.w / 2, it.y + 88 + j * 15, 13, INK, 'center', 'bold')); }
      else { ctx.beginPath(); ctx.arc(it.x + it.w / 2, it.y + 46, r, 0, Math.PI * 2); ctx.setLineDash([6, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = MUTED; ctx.stroke(); ctx.setLineDash([]);
        text('Vide', it.x + it.w / 2, it.y + 96, 14, MUTED, 'center', 'bold'); } }
  }
}
function drawC(items) {
  ctx.beginPath(); ctx.ellipse(FIG_C.x, FIG_C.y + 130, 210, 34, 0, 0, Math.PI * 2); ctx.fillStyle = BG2; ctx.fill();
  for (const it of items.filter(i => i.anchor)) { const cx = it.cx ?? it.x + it.w / 2, cy = it.cy ?? it.y + it.h / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(it.anchor[0], it.anchor[1]); ctx.setLineDash([5, 6]); ctx.lineWidth = 2; ctx.strokeStyle = '#8f84a8'; ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(it.anchor[0], it.anchor[1], 5, 0, Math.PI * 2); ctx.fillStyle = '#8f84a8'; ctx.fill(); }
  drawFighter(FIG_C.x, FIG_C.y, FIG_C.s, state.fighter);
  rr(24, 578, W - 48, 118, 16); fillO(PANEL, 3); text('Réserve : clique une arme pour l’avoir en main, une compétence pour l’équiper', 44, 596, 15, MUTED, 'left', 'bold');
  ctx.beginPath(); ctx.moveTo(40 + 5 * ((W - 80) / 15), 612); ctx.lineTo(40 + 5 * ((W - 80) / 15), 680); ctx.lineWidth = 2; ctx.strokeStyle = PANEL2; ctx.stroke();
  for (const it of items) {
    const focus = state.focus === itemKey(it);
    if (it.kind === 'cslot') { const id = it.slot === 'weapon' ? state.fighter.weapon : state.fighter.skills[it.slot]; const r = it.w / 2;
      if (focus) { ctx.beginPath(); ctx.arc(it.cx, it.cy, r + 9, 0, Math.PI * 2); ctx.setLineDash([6, 5]); ctx.lineWidth = 3; ctx.strokeStyle = CREAM; ctx.stroke(); ctx.setLineDash([]); }
      if (id) drawIcon(id, it.cx, it.cy, r - 4); else { ctx.beginPath(); ctx.arc(it.cx, it.cy, r - 4, 0, Math.PI * 2); ctx.fillStyle = BG2; ctx.fill(); ctx.setLineDash([6, 5]); ctx.lineWidth = 3; ctx.strokeStyle = '#8f84a8'; ctx.stroke(); ctx.setLineDash([]); text('+', it.cx, it.cy + 1, 30, '#8f84a8', 'center', 'bold'); }
      text(it.slot === 'weapon' ? 'Arme' : `Compétence ${it.slot + 1}`, it.cx, it.cy + r + 14, 14, '#d8cfe8', 'center', 'bold'); }
    else if (it.kind === 'ccos') { rr(it.x, it.y, it.w, it.h, 12); fillO(BG2, 2.5); if (focus) focusRing(it);
      text(it.label, it.x + 14, it.y + 18, 14, '#b9afcc', 'left', 'bold');
      if (isColor(it.k)) { rr(it.x + 14, it.y + 32, 60, 18, 6); fillO(COS[it.k].opts[state.fighter[it.k]], 2); }
      else text(cosName(it.k, state.fighter[it.k]), it.x + 14, it.y + 41, 17, CREAM, 'left', 'bold');
      ctx.beginPath(); const ax = it.x + it.w - 22, ay = it.y + it.h / 2; ctx.moveTo(ax - 6, ay - 9); ctx.lineTo(ax + 6, ay); ctx.lineTo(ax - 6, ay + 9); ctx.closePath(); ctx.fillStyle = CREAM; ctx.fill(); }
    else if (it.kind === 'icon') { if (focus) focusRing(it); drawIcon(it.id, it.cx, it.cy, it.r, { equipped: equipped(it.id) }); }
  }
}
function drawTooltip(items) {
  let id = null, at = null;
  if (state.pin && state.pinT > 0) id = state.pin;
  else if (state.hover && state.hoverT >= tune.tooltip_delay) id = state.hover;
  else { const f = items.find(i => itemKey(i) === state.focus); if (f && f.id) id = f.id; }
  if (!id) return;
  at = items.find(i => i.id === id); if (!at) return;
  const item = ITEMS[id], fam = FAMILY[item.fam], tw = 300, lines = wrap(item.fx, tw - 32, 16);
  const th = 76 + lines.length * 20;
  let x = at.x + at.w + 12, y = at.y; if (x + tw > W - 8) x = at.x - tw - 12; if (x < 8) x = Math.min(W - tw - 8, Math.max(8, at.x));
  if (y + th > H - 8) y = H - th - 8; if (x < at.x + at.w && x + tw > at.x && y < at.y + at.h) y = at.y - th - 10; y = Math.max(60, y);
  rr(x, y, tw, th, 12); fillO('#fffaf0', 3);
  rr(x, y, tw, 8, [12, 12, 0, 0]); ctx.fillStyle = fam.color; ctx.fill();
  text(item.name, x + 16, y + 32, 20, INK, 'left', 'bold');
  text(`${fam.label}${equipped(id) ? ' · équipé' : ''}`, x + 16, y + 56, 15, MUTED, 'left', 'bold');
  lines.forEach((l, j) => text(l, x + 16, y + 82 + j * 20, 16, '#3a3446', 'left'));
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
fit();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
